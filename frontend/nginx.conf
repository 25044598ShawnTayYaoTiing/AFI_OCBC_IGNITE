server {
    client_max_body_size 105m;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 660s; }
    location /actuator/ { proxy_pass http://backend:8080; }
    location = /ai-health { proxy_pass http://ai-service:8000/health; }
    location /v3/api-docs/ { proxy_pass http://backend:8080; }
    location = /v3/api-docs { proxy_pass http://backend:8080; }
    location /swagger-ui/ { proxy_pass http://backend:8080; }
    location = /swagger-ui.html { proxy_pass http://backend:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
