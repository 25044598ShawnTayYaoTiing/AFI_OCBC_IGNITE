# Public edge for EC2. Backend and AI have no published host ports.
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 105m;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-cache" always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
    }
    location = /actuator/health { proxy_pass http://backend:8080/actuator/health; }
    location = /ai-health { proxy_pass http://ai-service:8000/health; }
    location /actuator/ { return 404; }
    location /v3/api-docs { return 404; }
    location /swagger-ui { return 404; }
    location ^~ /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
