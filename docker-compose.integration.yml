# Disposable local/CI PostgreSQL only. Both frontends still use the same Spring backend.
# Do not combine with the application/AWS Compose files or point this at real data.
name: afi-resolve-integration
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: afi_resolve_test
      POSTGRES_USER: afi_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set a temporary TEST_DB_PASSWORD}
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55433}:5432"
    # No named volume or host database directory; removing the container loses the data.
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
