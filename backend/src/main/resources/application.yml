server:
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 105MB
  profiles:
    default: demo
  application:
    name: afi-resolve
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/afi_resolve}
    username: ${DB_USERNAME:afi}
    password: ${DB_PASSWORD:afi-local-demo}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
afi:
  demo-enabled: ${DEMO_ENABLED:true}
  operator-password: ${OPERATOR_PASSWORD:operator-demo}
  reviewer-password: ${REVIEWER_PASSWORD:reviewer-demo}
  rules-admin-password: ${RULES_ADMIN_PASSWORD:rules-admin-demo}
  document-storage: ${DOCUMENT_STORAGE:.local/documents}
  storage-provider: ${DOCUMENT_STORAGE_PROVIDER:local}
  document-automation-enabled: ${DOCUMENT_AUTOMATION_ENABLED:true}
  document-automation-max-attempts: ${DOCUMENT_AUTOMATION_MAX_ATTEMPTS:3}
  s3-bucket: ${S3_BUCKET:}
  s3-region: ${AWS_REGION:ap-southeast-1}
  s3-prefix: ${S3_DOCUMENT_PREFIX:documents/}
  ai-url: ${AI_SERVICE_URL:http://localhost:8000}
  ai-key: ${AI_SERVICE_KEY:afi-internal-demo-key}
  cors-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  customer-portal-origins: ${CUSTOMER_PORTAL_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
  customer-session-seconds: ${CUSTOMER_SESSION_SECONDS:1800}
logging:
  level:
    org.hibernate: WARN
