name: AFI Resolve CI
'on':
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package and test customer routing and shared upload workflow
        working-directory: backend
        run: mvn -B '-Dtest=CustomerIntegrationTest,CustomerDemoRetryIntegrationTest#syntheticRetriesAreImmediateButOtherAccountsStillLock,DigitalFormIntegrationTest,CustomerEmailTransportTest' package
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
  ai-and-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: ai-service
      - name: Essential AI health, authentication and document extraction checks
        working-directory: ai-service
        run: python -m pytest -q tests/test_foundation.py tests/test_api.py::test_service_key_is_required tests/test_api.py::test_wrong_key_rejected tests/test_document_extraction.py
      - run: python scripts/ci/validate_compose.py
      - run: python -m unittest discover -s scripts/demo -p test_provision_test_accounts.py
      - run: python -m unittest discover -s scripts/aws -p 'test_*.py'
  images:
    needs: [backend, frontend, ai-and-configuration]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, ai-service]
    env:
      AWS_REGION: ap-southeast-1
      REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX || 'afi-resolve' }}
      PUBLISH_IMAGES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Require main publishing configuration
        if: env.PUBLISH_IMAGES == 'true'
        env:
          PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
        run: test -n "$PUBLISH_ROLE_ARN" || { echo 'Configure AWS_ECR_PUBLISH_ROLE_ARN and ECR before enabling main publishing.' >&2; exit 1; }
      - if: env.PUBLISH_IMAGES == 'true'
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '092004973012'
      - if: env.PUBLISH_IMAGES == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Preserve immutable tags on a CI rerun
        if: env.PUBLISH_IMAGES == 'true'
        id: existing
        env:
          SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY_PREFIX/$SERVICE" --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>"$RUNNER_TEMP/ecr-query-error"; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException "$RUNNER_TEMP/ecr-query-error"; then
            echo 'present=false' >> "$GITHUB_OUTPUT"
          else
            echo 'ECR repository or permissions are not configured.' >&2
            exit 1
          fi
      - name: Build application image; publish only trusted main pushes
        if: steps.existing.outputs.present != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          tags: ${{ steps.ecr.outputs.registry || 'local' }}/${{ env.REPOSITORY_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            AFI_RELEASE_SHA=${{ github.sha }}
            ${{ matrix.service == 'frontend' && 'NGINX_CONFIG=nginx.aws.conf' || '' }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
