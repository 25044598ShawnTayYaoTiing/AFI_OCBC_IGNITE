name: AFI Read Failed Deployment
'on':
  workflow_dispatch:
    inputs:
      command_id:
        description: Existing failed SSM command UUID (read only)
        type: string
        required: true
        default: 9facf8e8-8b3e-4e67-b715-0db749c21392
      read_host_logs:
        description: Also attempt fixed read-only Docker diagnostics using existing IAM permissions
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
jobs:
  diagnostics:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '092004973012'
      - name: Read sanitised result of the existing failed command
        env:
          FAILED_COMMAND_ID: ${{ inputs.command_id }}
        run: python3 scripts/aws/read_deployment_diagnostics.py
      - name: Attempt fixed read-only host diagnostics without changing IAM
        if: inputs.read_host_logs
        run: python3 scripts/aws/read_failed_host.py
